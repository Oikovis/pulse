name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much as you can.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.5.2"
    validations:
      required: true

  - type: input
    id: pulse-version
    attributes:
      label: Pulse version
      placeholder: "0.0.1"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include steps to reproduce.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste from Settings → System → Logs. Redact tokens.
      render: shell
